  <path d="M418,103 C372,148 298,188 236,222" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round" opacity="0.28"/>
  <path d="M408,107 C354,160 272,204 200,302" fill="none" stroke="#059669" stroke-width="1.0" stroke-linecap="round" opacity="0.14"/>
  <path d="M401,111 C340,170 254,220 174,392" fill="none" stroke="#059669" stroke-width="0.8" stroke-linecap="round" opacity="0.09"/>

  <path d="M482,103 C528,148 602,188 664,222" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round" opacity="0.28"/>
  <path d="M492,107 C546,160 628,204 700,302" fill="none" stroke="#059669" stroke-width="1.0" stroke-linecap="round" opacity="0.14"/>
