  <rect x="250" y="386" width="400" height="22" rx="5" fill="#eae9e5" stroke="#1a1a1a" stroke-width="1.8"/>
  <rect x="374" y="392" width="88" height="11" rx="5" fill="#d8d7d3" stroke="#ccc" stroke-width="1"/>

