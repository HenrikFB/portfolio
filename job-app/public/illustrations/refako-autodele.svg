<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <style>
      .f   { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
      .lbl { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #1a1a1a; font-weight: 600; }
      .sub { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #aaa; }
      .tag { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #bbb; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="900" height="460" fill="#fff"/>

