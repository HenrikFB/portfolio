    <text x="26" y="28" text-anchor="middle" class="f" font-size="10" fill="#059669" font-weight="600">B2B</text>
    <text x="26" y="38" text-anchor="middle" class="f" font-size="10" fill="#059669" font-weight="600">B2C</text>
