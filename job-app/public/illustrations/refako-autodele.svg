  <text x="790" y="452" text-anchor="middle" class="sub">B2B - B2C</text>

  <line x1="136" y1="218" x2="268" y2="252" stroke="#059669" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.35"/>
  <line x1="136" y1="308" x2="268" y2="295" stroke="#059669" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.35"/>
  <line x1="136" y1="398" x2="268" y2="362" stroke="#059669" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.35"/>
  <line x1="764" y1="218" x2="632" y2="252" stroke="#059669" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.35"/>
  <line x1="764" y1="308" x2="632" y2="295" stroke="#059669" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.35"/>
